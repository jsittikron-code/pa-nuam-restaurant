<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ร้านอาหารป้านวม จำกัด (มหาชน)</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    margin:0;
}

header{
    background:#ff6600;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    width:90%;
    margin:auto;
}

.menu{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.card{
    background:white;
    width:300px;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.food-name{
    font-size:22px;
    font-weight:bold;
}

.price{
    color:red;
    font-size:20px;
    margin-top:10px;
}

.star{
    color:gold;
    font-size:22px;
}

footer{
    text-align:center;
    padding:20px;
    margin-top:30px;
    background:#333;
    color:white;
}

</style>

</head>
<body>

<header>
    <h1>🍛 ร้านอาหารป้านวม จำกัด (มหาชน)</h1>
    <p>อร่อย สะอาด รสชาติเหมือนกินที่บ้าน</p>
</header>

<div class="container">

<h2 align="center">เมนูแนะนำ</h2>

<div class="menu">

    <div class="card">
        <img src="https://images.unsplash.com/photo-1512058564366-18510be2db19">
        <div class="card-body">
            <div class="food-name">ข้าวกะเพราหมูกรอบ</div>
            <div class="price">65 บาท</div>
            <div class="star">★★★★★</div>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1569718212165-3a8278d5f624">
        <div class="card-body">
            <div class="food-name">ข้าวผัดกุ้ง</div>
            <div class="price">70 บาท</div>
            <div class="star">★★★★☆</div>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d">
        <div class="card-body">
            <div class="food-name">ผัดซีอิ๊วหมู</div>
            <div class="price">60 บาท</div>
            <div class="star">★★★★★</div>
        </div>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1562967916-eb82221dfb92">
        <div class="card-body">
            <div class="food-name">ต้มยำกุ้ง</div>
            <div class="price">120 บาท</div>
            <div class="star">★★★★★</div>
        </div>
    </div>

</div>

</div>

<footer>
    © 2026 ร้านอาหารป้านวม จำกัด (มหาชน)
</footer>

</body>
</html>
